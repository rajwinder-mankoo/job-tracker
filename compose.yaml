services:
  job-tracker:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/google-service-account.json
    volumes:
      - ./secrets:/app/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
